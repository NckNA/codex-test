name: Reconstruct communication orchestration task

on:
  push:
    branches:
      - feature/communication-orchestration-foundation-001
    paths:
      - _ai_work/communication_orchestration_bundle/READY

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat _ai_work/communication_orchestration_bundle/xz/part-* | base64 -d > /tmp/communication-orchestration.tar.xz
          echo "e98131ca5088e4d0a9d0388c2a74e3de82257dab468fcfa8263c940a4acec734  /tmp/communication-orchestration.tar.xz" | sha256sum -c -
          tar -xJf /tmp/communication-orchestration.tar.xz -C .
          rm -rf _ai_work/communication_orchestration_bundle
          rm .github/workflows/communication-orchestration-reconstruct.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "COMMUNICATION-ORCHESTRATION-FOUNDATION-001: implement orchestration foundation"
          git push origin HEAD:${GITHUB_REF_NAME}
