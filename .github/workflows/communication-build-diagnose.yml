name: Diagnose communication orchestration build

on:
  push:
    branches:
      - feature/communication-orchestration-foundation-001
    paths:
      - _ai_work/communication_build_diagnose/READY

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture build result
        shell: bash
        run: |
          set +e
          npm run build > /tmp/communication-build.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "--- build output ---"
            cat /tmp/communication-build.log
          } > _ai_work/communication_build_failure.log
          rm -rf _ai_work/communication_build_diagnose
          rm .github/workflows/communication-build-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture orchestration build diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
