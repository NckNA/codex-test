name: Finalize communication orchestration fixes

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/communication-orchestration-foundation-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply TypeScript fixes and restore CI files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repository = Path('src/data/repositories/CommunicationOrchestrationRepository.ts')
          text = repository.read_text(encoding='utf-8')
          old = """export class SupabaseCommunicationOrchestrationRepository implements CommunicationOrchestrationRepository {
            constructor(
              private readonly tenantId: string,
              private readonly client: SupabaseClient,
            ) {}
          """
          new = """export class SupabaseCommunicationOrchestrationRepository implements CommunicationOrchestrationRepository {
            private readonly tenantId: string;
            private readonly client: SupabaseClient;

            constructor(tenantId: string, client: SupabaseClient) {
              this.tenantId = tenantId;
              this.client = client;
            }
          """
          if old not in text:
              raise SystemExit('repository constructor pattern not found')
          repository.write_text(text.replace(old, new), encoding='utf-8')

          page = Path('src/pages/CommunicationDiagnosticsPage.tsx')
          text = page.read_text(encoding='utf-8')
          old = "{item.communicationEligibility?.blockedReasons?.join(', ') || 'нет'}"
          new = """{[
                            ...(item.communicationEligibility?.sms.blockedReasons ?? []),
                            ...(item.communicationEligibility?.whatsapp.blockedReasons ?? []),
                            ...(item.communicationEligibility?.email.blockedReasons ?? []),
                          ].join(', ') || 'нет'}"""
          if old not in text:
              raise SystemExit('blocked reasons pattern not found')
          page.write_text(text.replace(old, new), encoding='utf-8')

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          package.write_text(text.replace('"test": "tsc -b --pretty false"', '"test": "vitest run"'), encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci.write_text("""name: CI

          on:
            push:
              branches: [ \"main\" ]
            pull_request:
              branches: [ \"main\" ]

          jobs:
            validate:
              runs-on: ubuntu-latest

              steps:
              - name: Checkout code
                uses: actions/checkout@v4

              - name: Use Node.js 24.x
                uses: actions/setup-node@v4
                with:
                  node-version: 24
                  cache: 'npm'

              - name: Install dependencies
                run: npm ci

              - name: Run ESLint
                run: npm run lint

              - name: Run tests
                run: npm run test

              - name: Build project
                run: npm run build
            merge_guard:
              name: Merge guard
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-latest
              steps:
              - name: Block explicitly protected pull requests
                env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
                shell: bash
                run: |
                  text=\"$PR_TITLE
                  $PR_BODY\"
                  if printf '%s' \"$text\" | grep -Eiq '(DO[[:space:]]+NOT[[:space:]]+MERGE|MUST[[:space:]]+REMAIN[[:space:]]+OPEN[[:space:]]+AND[[:space:]]+UNMERGED|НЕ[[:space:]]+СЛИВАТЬ|НЕ[[:space:]]+ОБЪЕДИНЯТЬ)'; then
                    echo 'Merge blocked because the pull request is explicitly marked as protected.'
                    exit 1
                  fi
                  echo 'No explicit merge prohibition found.'
          """, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/repositories/CommunicationOrchestrationRepository.ts src/pages/CommunicationDiagnosticsPage.tsx package.json .github/workflows/ci.yml
          git commit -m "fix: align communication orchestration TypeScript contracts"
          git push origin HEAD:${{ github.head_ref }}
