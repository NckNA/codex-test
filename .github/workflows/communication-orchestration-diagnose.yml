name: Diagnose communication orchestration tests

on:
  push:
    branches:
      - feature/communication-orchestration-foundation-001
    paths:
      - _ai_work/communication_orchestration_diagnose/READY

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture test result
        shell: bash
        run: |
          set +e
          npm run test -- --run > /tmp/communication-tests.log 2>&1
          status=$?
          set -e
          mkdir -p _ai_work
          {
            echo "exit_status=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "--- tail ---"
            tail -n 500 /tmp/communication-tests.log
          } > _ai_work/communication_orchestration_test_failure.log
          rm -rf _ai_work/communication_orchestration_diagnose
          rm .github/workflows/communication-orchestration-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture orchestration test diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
